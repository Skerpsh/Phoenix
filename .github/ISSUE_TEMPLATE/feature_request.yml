name: Idea or feature request
description: Suggest something Phoenix could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what you'd like Phoenix to do. What it should solve matters more than how.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
